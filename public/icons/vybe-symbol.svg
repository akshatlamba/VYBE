<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Left Arm: Royal Electric Blue into Vivid Sky/Cyan -->
    <linearGradient id="vybe-blue-arm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="25%" stop-color="#3B82F6" />
      <stop offset="60%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Bottom Pivot / Apex: Glowing Cyan Accent -->
    <linearGradient id="vybe-cyan-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>

    <!-- Right Arm: Radiant Lilac to Deep Violet -->
    <linearGradient id="vybe-purple-arm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D9C9F5" />
      <stop offset="35%" stop-color="#C084FC" />
      <stop offset="70%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <filter id="vybe-glow-mark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#7C3AED" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="1" stdDeviation="6" flood-color="#38BDF8" flood-opacity="0.30" />
    </filter>
  </defs>

  <g filter="url(#vybe-glow-mark)">
    <!-- Left Blue Arm Capsule -->
    <rect
      x="20"
      y="12"
      width="21"
      height="68"
      rx="10.5"
      transform="rotate(-23 30.5 46)"
      fill="url(#vybe-blue-arm)"
    />

    <!-- Cyan rounded pivot cap at apex -->
    <circle
      cx="49.5"
      cy="76.5"
      r="10.5"
      fill="url(#vybe-cyan-accent)"
    />

    <!-- Right Purple Arm Capsule -->
    <rect
      x="59"
      y="12"
      width="21"
      height="60"
      rx="10.5"
      transform="rotate(23 69.5 42)"
      fill="url(#vybe-purple-arm)"
    />
  </g>
</svg>
