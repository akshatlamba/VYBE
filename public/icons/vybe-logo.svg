<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <defs>
    <linearGradient id="vl-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="25%" stop-color="#3B82F6" />
      <stop offset="65%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="vl-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <linearGradient id="vl-purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF" />
      <stop offset="35%" stop-color="#C084FC" />
      <stop offset="70%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
  </defs>

  <!-- V Symbol (scaled down inside 60x60 space) -->
  <g transform="translate(6, 4) scale(0.52)">
    <!-- Left Arm -->
    <rect x="20" y="12" width="21" height="68" rx="10.5" transform="rotate(-23 30.5 46)" fill="url(#vl-blue)" />
    <!-- Apex -->
    <circle cx="49.5" cy="76.5" r="10.5" fill="url(#vl-cyan)" />
    <!-- Right Arm -->
    <rect x="59" y="12" width="21" height="60" rx="10.5" transform="rotate(23 69.5 42)" fill="url(#vl-purple)" />
  </g>

  <!-- VYBE Text -->
  <text x="68" y="39" fill="#FFFFFF" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="28" font-weight="900" letter-spacing="-0.03em">VYBE</text>
</svg>
